<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-vindas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .welcome-message {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            text-align: left;
            line-height: 1.7;
            color: #2d3748;
        }

        .welcome-message p {
            margin-bottom: 10px;
        }

        .welcome-message p:last-child {
            margin-bottom: 0;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 25px;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .welcome-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .welcome-icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="welcome-icon">👋</div>
        <h1>Bem-vindo!</h1>
        <p class="subtitle">É um prazer ter você aqui</p>

        <div class="welcome-message">
            <p>🌟 <strong>Olá, visitante!</strong></p>
            <p>Esta é uma página de boas-vindas criada com HTML e CSS.</p>
            <p>✨ Sinta-se à vontade para explorar e personalizar conforme sua necessidade.</p>
        </div>

        <a href="#" class="btn">Começar</a>

        <div class="footer">
            &copy; 2024 · Todos os direitos reservados
        </div>
    </div>

</body>
</html>
